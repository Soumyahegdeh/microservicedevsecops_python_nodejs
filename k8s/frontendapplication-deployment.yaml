apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: soumyahe/frontendapplication:74f1cd34841e48993c60828749a31b6b54c11495
          ports:
            - containerPort: 80
