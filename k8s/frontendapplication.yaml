apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false 
          image: soumyahe/frontendapplication:3b459f8f6cb287e9e0424c9ac5caa43be395293d
          ports:
            - containerPort: 80
