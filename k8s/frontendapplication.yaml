apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false 
          image: soumyahe/frontendapplication:d9c73b4f30eb48f9225489e71252b36abb73fc54
          ports:
            - containerPort: 80
