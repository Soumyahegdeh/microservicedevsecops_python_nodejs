apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false 
          image: soumyahe/frontendapplication:a85e76370b84e4717e9099251ce8fd946dbbfca7
          ports:
            - containerPort: 80
