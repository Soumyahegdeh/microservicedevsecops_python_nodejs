apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quotes
  template:
    metadata:
      labels:
        app: quotes
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: quotes
          securityContext:
            allowPrivilegeEscalation: false
          image: soumyahe/quoteservice:d9c73b4f30eb48f9225489e71252b36abb73fc54
          ports:
            - containerPort: 5000
