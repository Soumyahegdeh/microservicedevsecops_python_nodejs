name: Container Security Template
on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      service_type:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true


jobs:
  docker_build:
     name: Build and Push Docker Image
     runs-on: ubuntu-latest
     #needs: [sca_safety, sast_bandit, secret_detection]

     steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
         context: ${{ inputs.service_path }}
         file: ${{ inputs.service_path }}/app.dockerfile
         push: true
         tags: |
            soumyahe/apigateway:${{ github.run_number }}
          #  soumyahe/apigateway:latest
         cache-from: type=gha
         cache-to: type=gha,mode=max


      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: soumyahe/apigateway:${{ github.run_number }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL

      - name: Smoke Test Container
        run: |
           docker run -d -p 3000:3000 --name test soumyahe/apigateway:${{ github.run_number }}
           sleep 10
           curl -f http://localhost:3000/health
           docker stop test
           docker rm test


      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif


