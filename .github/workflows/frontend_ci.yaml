name: Frontend Application CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write
jobs:
  security:
    uses: ./.github/workflows/code_security_template.yml
    with:
      service_path: FrontendApplication
      service_type: node
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  container_security:
    needs: security
    uses: ./.github/workflows/container_security_template.yml 
    with:
      image_name: soumyahe/frontendapplication
      app_port: 3000
      container_port: 80
      service_path: FrontendApplication
      service_type: node
      health_path: /
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      
  dast_security:
    needs: container_security
    uses: ./.github/workflows/dast_security_template.yml
    with:
       image_name: soumyahe/frontendapplication:${{ github.run_number }}
       app_port: 3000
       service_path: FrontendApplication
       service_type: node
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  


    