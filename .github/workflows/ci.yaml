name: CI Template
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

# =========================
# 1. REPO SECURITY
# =========================
  security_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2

      - name: Semgrep SAST Scan
        if: github.event_name == 'push'
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1"

      - name: Upload Semgrep results
        if: always()  
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
  code_security:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         include:
          - service: ApiGateway
            path: ApiGateway
            service_type: node

          - service: QuoteService
            path: QuoteService
            service_type: python

          - service: FrontendApplication
            path: FrontendApplication
            service_type: node

     steps:
      - uses: actions/checkout@v4

      
      - name: Setup Node
        if: matrix.service_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        if: matrix.service_type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npm install
          else
            pip install -r requirements.txt
          fi


      - name: Run ESLint (Code Quality Check)
        run: |
           cd ${{ matrix.path }}
           if npm run | grep -q "lint"; then
              npm run lint
           else
              echo "No lint script found, skipping..."
           fi
      - name: Run Snyk Security Scan
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npx snyk test --severity-threshold=critical
          else
           pip install pip-audit
           pip-audit -r requirements.txt
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Tests
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            # Check if test script is the default placeholder
            TEST_SCRIPT=$(node -e "console.log(require('./package.json').scripts?.test || '')")
            if [[ "$TEST_SCRIPT" == *"no test specified"* ]] || [ -z "$TEST_SCRIPT" ]; then
                echo "No real tests found, skipping..."
            else
               npm test
            fi
          else
            if [ -d "tests" ]; then
              pip install pytest
              pytest tests/
            else
              echo "No Python tests found, skipping..."
            fi
          fi

# =========================
# 2. CONTAINER SECURITY
# =========================
  container_security:
    runs-on: ubuntu-latest
    needs: code_security
    permissions:
     contents: read
     security-events: write
    strategy:
      matrix:
       include:
        - service: ApiGateway
          path: ApiGateway
          service_type: node
          image_name: soumyahegdeh/api-gateway
          app_port: 3000
          container_port: 3000
          health_path: /health

        - service: QuoteService
          path: QuoteService
          service_type: python
          image_name: soumyahegdeh/quote-service
          app_port: 5000
          container_port: 5000
          health_path: /health

        - service: FrontendApplication
          path: FrontendApplication
          service_type: node
          image_name: soumyahegdeh/frontend-application
          app_port: 80
          container_port: 80
          health_path: /

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 1 - Build locally, don't push yet
      - name: Build Image
        uses: docker/build-push-action@v5
        with:
         context: ${{ matrix.path }}
         file: ${{ matrix.path }}/app.dockerfile
         push: false
         load: true
         tags: ${{ matrix.image_name }}:${{ github.sha }}
         cache-from: type=gha
         cache-to: type=gha,mode=max

    # Step 2 - Save image to tar file
      - name: Save Image to tar
        run: |
          docker save ${{ matrix.image_name }}:${{ github.sha }} \
          -o ${{ github.workspace }}/${{ matrix.service }}.tar
          ls -lh ${{ github.workspace }}/${{ matrix.service }}.tar

    # Step 3 - Install Trivy binary directly
      - name: Install Trivy
        run: |
           wget -qO- https://github.com/aquasecurity/trivy/releases/download/v0.61.0/trivy_0.61.0_Linux-64bit.tar.gz | tar -xz
           sudo mv trivy /usr/local/bin/
           trivy --version

    # Step 4 - Human readable table (visible in Actions log)
      - name: Trivy vulnerability summary
        run: |
          trivy image \
            --input ${{ github.workspace }}/${{ matrix.service }}.tar \
            --severity HIGH,CRITICAL \
            --format table
        continue-on-error: true

    # Step 5 - SARIF format for GitHub Security tab
      - name: Scan Image with Trivy
        id: trivy-scan
        run: |
          trivy image \
            --input ${{ github.workspace }}/${{ matrix.service }}.tar \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output ${{ github.workspace }}/trivy-${{ matrix.service }}.sarif \
            --exit-code 1
        continue-on-error: true

    # Step 6 - Upload SARIF to GitHub Security tab
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

    # Step 7 - Fail pipeline if vulnerabilities found
      - name: Check Trivy result
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "❌ Trivy found HIGH/CRITICAL vulnerabilities in ${{ matrix.service }}!"
          echo "Fix the vulnerabilities before pushing to Docker Hub"
          exit 1

    # Step 8 - Smoke test
      - name: Smoke Test
        run: |
          docker run -d \
            -p ${{ matrix.app_port }}:${{ matrix.container_port }} \
            --name test_${{ matrix.service }} \
            ${{ matrix.image_name }}:${{ github.sha }}

          sleep 10

          docker ps | grep test_${{ matrix.service }}

          curl --fail \
             --retry 3 \
             --retry-delay 5 \
             http://localhost:${{ matrix.app_port }}${{ matrix.health_path }}

          docker stop test_${{ matrix.service }}
          docker rm test_${{ matrix.service }}

    # Step 9 - Push ONLY if everything passed
      - name: Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/app.dockerfile
          push: true
          tags: |
            ${{ matrix.image_name }}:${{ github.sha }}
            ${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max