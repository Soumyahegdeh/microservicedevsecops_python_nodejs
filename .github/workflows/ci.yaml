name: CI pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

# =========================
# 1. REPO SECURITY
# =========================
  security_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2

      - name: Semgrep SAST Scan
        if: github.event_name == 'push'
        id: semgrep
        uses: semgrep/semgrep-action@v1
        with:
           config: auto
        continue-on-error: true

      - name: Ensure semgrep.sarif exists      # ← fixed valid SARIF
        if: always()
        run: |
          if [ ! -f semgrep.sarif ]; then
            cat > semgrep.sarif << 'EOF'
            {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [
                {
                  "tool": {
                    "driver": {
                      "name": "Semgrep",
                      "version": "1.0.0",
                      "rules": []
                    }
                  },
                  "results": []
                }
              ]
            }
            EOF
          fi

      - name: Upload Semgrep results           # ← skip if semgrep was skipped
        if: always() && steps.semgrep.outcome != 'skipped' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

# =========================
# 2. CODE SECURITY
# =========================
  code_security:
    runs-on: ubuntu-latest
    needs: security_scan         # ← wait for repo scan first
    strategy:
      fail-fast: false           # ← don't cancel other services if one fails
      matrix:
        include:
          - service: ApiGateway
            path: ApiGateway
            service_type: node

          - service: QuoteService
            path: QuoteService
            service_type: python

          - service: FrontendApplication
            path: FrontendApplication
            service_type: node

    steps:
      - uses: actions/checkout@v4

      # ✅ Cache node_modules — avoids reinstalling every run
      - name: Cache Node modules
        if: matrix.service_type == 'node'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.path }}/node_modules
          key: node-${{ matrix.service }}-${{ hashFiles(format('{0}/package-lock.json', matrix.path)) }}
          restore-keys: node-${{ matrix.service }}-

      # ✅ Cache pip packages — avoids reinstalling every run
      - name: Cache Python packages
        if: matrix.service_type == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.service }}-${{ hashFiles(format('{0}/requirements.txt', matrix.path)) }}
          restore-keys: pip-${{ matrix.service }}-

      - name: Setup Node
        if: matrix.service_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        if: matrix.service_type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npm ci              # ← faster than npm install, uses lockfile
          else
            pip install -r requirements.txt
          fi

      - name: Run ESLint
        if: matrix.service_type == 'node'    # ← skip for python
        run: |
          cd ${{ matrix.path }}
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping..."
          fi

      - name: Run Snyk Security Scan
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npx snyk test --severity-threshold=critical
          else
            pip install pip-audit
            pip-audit -r requirements.txt
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Tests
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            TEST_SCRIPT=$(node -e "console.log(require('./package.json').scripts?.test || '')")
            if [[ "$TEST_SCRIPT" == *"no test specified"* ]] || [ -z "$TEST_SCRIPT" ]; then
              echo "No real tests found, skipping..."
            else
              npm test
            fi
          else
            if [ -d "tests" ]; then
              pip install pytest
              pytest tests/
            else
              echo "No Python tests found, skipping..."
            fi
          fi

# =========================
# 3. CONTAINER SECURITY
# =========================
  container_security:
    runs-on: ubuntu-latest
    needs: code_security
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false           # ← don't cancel other services if one fails
      matrix:
        include:
          - service: ApiGateway
            path: ApiGateway
            service_type: node
            image_name: soumyahe/apigateway
            app_port: 3000
            container_port: 3000
            health_path: /health

          - service: QuoteService
            path: QuoteService
            service_type: python
            image_name: soumyahe/quoteservice
            app_port: 5000
            container_port: 5000
            health_path: /health

          - service: FrontendApplication
            path: FrontendApplication
            service_type: node
            image_name: soumyahe/frontendapplication
            app_port: 80
            container_port: 80
            health_path: /

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ Build + save tar in one step (no double build)
      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/app.dockerfile
          push: false
          load: true
          tags: ${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha   # ← reuse cached layers
          cache-to: type=gha,mode=max

      - name: Save Image to tar
        run: |
          docker save ${{ matrix.image_name }}:${{ github.sha }} \
            -o ${{ github.workspace }}/${{ matrix.service }}.tar

      # ✅ Install Trivy once using cache
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      # ✅ Table + SARIF in one trivy call
      - name: Scan Image with Trivy
        id: trivy-scan
        run: |
          # Table format for humans
          trivy image \
            --input ${{ github.workspace }}/${{ matrix.service }}.tar \
            --severity HIGH,CRITICAL \
            --format table \
            --cache-dir ~/.cache/trivy

          # SARIF for GitHub Security tab
          trivy image \
            --input ${{ github.workspace }}/${{ matrix.service }}.tar \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output ${{ github.workspace }}/trivy-${{ matrix.service }}.sarif \
            --exit-code 1 \
            --cache-dir ~/.cache/trivy || true

          # Ensure SARIF file exists
          if [ ! -f "${{ github.workspace }}/trivy-${{ matrix.service }}.sarif" ]; then
            echo '{"version":"2.1.0","runs":[]}' > \
              ${{ github.workspace }}/trivy-${{ matrix.service }}.sarif
          fi
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Check Trivy result
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "❌ Trivy found vulnerabilities in ${{ matrix.service }}!"
          exit 1

      - name: Smoke Test
        run: |
          docker run -d \
            -p ${{ matrix.app_port }}:${{ matrix.container_port }} \
            --name test_${{ matrix.service }} \
            ${{ matrix.image_name }}:${{ github.sha }}
          sleep 10
          docker ps | grep test_${{ matrix.service }}
          curl --fail --retry 3 --retry-delay 5 \
            http://localhost:${{ matrix.app_port }}${{ matrix.health_path }}
          docker stop test_${{ matrix.service }}
          docker rm test_${{ matrix.service }}

      # ✅ Push directly — no rebuild
      - name: Push Image to Docker Hub
        run: |
          docker tag ${{ matrix.image_name }}:${{ github.sha }} \
                     ${{ matrix.image_name }}:latest
          docker push ${{ matrix.image_name }}:${{ github.sha }}
          docker push ${{ matrix.image_name }}:latest