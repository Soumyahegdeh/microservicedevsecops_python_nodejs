name: CI Template
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

# =========================
# 1. REPO SECURITY
# =========================
  security_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2

      - name: Semgrep SAST Scan
        if: github.event_name == 'push'
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1"

      - name: Upload Semgrep results
        if: always()  
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
  code_security:
     runs-on: ubuntu-latest
     strategy:
       matrix:
         include:
          - service: ApiGateway
            path: ApiGateway
            service_type: node

          - service: QuoteService
            path: QuoteService
            service_type: python

          - service: FrontendApplication
            path: FrontendApplication
            service_type: node

     steps:
      - uses: actions/checkout@v4

      
      - name: Setup Node
        if: matrix.service_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        if: matrix.service_type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npm install
          else
            pip install -r requirements.txt
          fi


      - name: Run ESLint (Code Quality Check)
        run: |
           cd ${{ matrix.path }}
           if npm run | grep -q "lint"; then
              npm run lint
           else
              echo "No lint script found, skipping..."
           fi
      - name: Run Snyk Security Scan
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            npx snyk test --severity-threshold=critical
          else
           pip install pip-audit
           pip-audit -r requirements.txt
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Tests
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.service_type }}" = "node" ]; then
            # Check if test script is the default placeholder
            TEST_SCRIPT=$(node -e "console.log(require('./package.json').scripts?.test || '')")
            if [[ "$TEST_SCRIPT" == *"no test specified"* ]] || [ -z "$TEST_SCRIPT" ]; then
                echo "No real tests found, skipping..."
            else
               npm test
            fi
          else
            if [ -d "tests" ]; then
              pip install pytest
              pytest tests/
            else
              echo "No Python tests found, skipping..."
            fi
          fi

# =========================
# 2. CONTAINER SECURITY
# =========================
  container_security:
    runs-on: ubuntu-latest
    needs: code_security
    strategy:
       matrix:
         include:
          - service: ApiGateway
            path: ApiGateway
            service_type: node
            image_name: soumyahegdeh/api-gateway
            app_port: 3000
            container_port: 3000
            health_path: /health
          - service: QuoteService
            path: QuoteService
            service_type: python
            image_name: soumyahegdeh/quote-service
            app_port: 5000
            container_port: 5000
            health_path: /health
          - service: FrontendApplication
            path: FrontendApplication
            service_type: node
            image_name: soumyahegdeh/frontend-application
            app_port: 80
            container_port: 80
            health_path: /

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/app.dockerfile
          push: false          # ← don't push yet
          load: true 
          tags: ${{ matrix.image_name }}:${{ github.sha }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0   # ← pinned version
        with:
          image-ref: ${{ matrix.image_name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: 1                           # ← fail if vulnerabilities found
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Smoke Test
        run: |
          docker run -d -p ${{ matrix.app_port }}:${{ matrix.container_port }} --name test \
          ${{ matrix.image_name }}:${{ github.sha }}

          sleep 10

          
          docker ps | grep test_${{ matrix.service }}

      
          curl --fail \
             --retry 3 \
             --retry-delay 5 \
             http://localhost:${{ matrix.app_port }}${{ matrix.health_path }}

       
          docker stop test_${{ matrix.service }}
          docker rm test_${{ matrix.service }}

      - name: Push Image (if scan passed)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/app.dockerfile
          push: true
          tags: |
            ${{ matrix.image_name }}:${{ github.sha }}
            ${{ matrix.image_name }}:latest
          cache-from: type=gha    # ← uses cached layers, no rebuild
          cache-to: type=gha,mode=max