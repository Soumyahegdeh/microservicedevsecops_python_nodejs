name: DAST - OWASP ZAP

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      app_port:
        required: true
        type: number
      service_path:
        required: true
        type: string  
      service_type:
        required: true
        type: string
      health_path:
        description: "Health endpoint"
        required: false
        type: string
        default: /health

      container_port:
         description: "Port inside container (nginx/service port)"
         required: false
         type: number
         default: 80

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  dast_zap:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Image
        run: docker pull ${{ inputs.image_name }}

      - name: Create Network
        run: docker network create zap-net || true

      - name: Run App Container
        run: |
          docker run -d --name app --network zap-net \
            -p ${{ inputs.app_port }}:${{ inputs.container_port }} \
            ${{ inputs.image_name }}

      - name: Wait for App
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:${{ inputs.app_port }}${{ inputs.health_path }}; then

              echo "App is up"
              exit 0
            fi
            sleep 5
          done
          docker logs app
          exit 1

      - name: Run OWASP ZAP
        run: |
          mkdir -p zap-reports

          docker run --rm \
            --network zap-net \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://app:${{ inputs.app_port }} \
            -r zap-report.html \
            -J zap-report.json \
            -m 5 \
            -a || true

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-reports

      - name: Cleanup
        if: always()
        run: |
          docker stop app || true
          docker rm app || true
