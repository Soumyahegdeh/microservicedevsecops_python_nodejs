name: API Gateway CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write
jobs:
  security:
    uses: ./.github/workflows/code_security_template.yml
    with:
      service_path: ApiGateway
      service_type: node
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  container_security:
    needs: security
    uses: ./.github/workflows/container_security_template.yml 
    with:
      service_path: ApiGateway
      service_type: node
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}


  dast:
    uses: ./.github/workflows/dast_template.yml
    needs: container_security
    with:
      image_name: soumyahe/apigateway:${{ github.run_number }}
      app_port: 3000
      secrets: inherit



    